services:
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["pnpm", "--filter", "@kairos/backend", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: file:./data/kairos.db
    volumes:
      - kairos-db:/app/backend/prisma/data
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 3333
      DATABASE_URL: file:./data/kairos.db
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET com pelo menos 32 caracteres aleatórios}
      FRONTEND_URL: ${FRONTEND_URL:?Defina a URL pública exata do frontend}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-kairos@codebycarlos.dev}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Defina SMTP_PASSWORD no ambiente}
      MAIL_FROM: ${MAIL_FROM:-Kairos <kairos@codebycarlos.dev>}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      ASAAS_API_URL: ${ASAAS_API_URL:-https://api.asaas.com/v3}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3333:3333"
    volumes:
      - kairos-db:/app/backend/prisma/data
      - ./backups:/app/backend/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Defina a URL pública da API}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Defina a URL pública da API}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:3333}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  kairos-db:
